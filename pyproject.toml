[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aitalenthub-persona"
version = "0.7.0"
description = "Joker character with switchable masks, Codex CLI, memory and Telegram"
requires-python = ">=3.11"
dependencies = []
license = {file = "LICENSE"}

[project.optional-dependencies]
minecraft = ["py4j==0.10.9.9"]
voice = ["sounddevice==0.5.6"]
tts = ["piper-tts==1.8.0", "sounddevice==0.5.6"]

[tool.setuptools]
packages = ["joker"]

[tool.setuptools.package-data]
joker = ["panel.html"]
